<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<title>Parable Treasure Hunt</title>
<style>
:root{--bg:#f4ede1;--card:#fbf7ef;--ink:#3a3028;--mut:#8a7a68;--line:#e2d6c1;--acc:#6f8f5e;--on:#fff;--ok:#4f7a46;--bad:#b5483a;--sea:#ebe4d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231f1a;--card:#2d2822;--ink:#efe6d6;--mut:#a8987f;--line:#40382f;--acc:#92b080;--on:#1d2618;--ok:#8fbf80;--bad:#d9806f;--sea:#2d2822}}
:root[data-theme="dark"]{--bg:#231f1a;--card:#2d2822;--ink:#efe6d6;--mut:#a8987f;--line:#40382f;--acc:#92b080;--on:#1d2618;--ok:#8fbf80;--bad:#d9806f;--sea:#2d2822}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;letter-spacing:.02em}
.w{max-width:620px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;font-weight:600;letter-spacing:.08em;margin:20px 0 4px;text-align:center}
.sub{text-align:center;color:var(--mut);font-size:14px;margin:0 0 18px}
.map{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px}
.map div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.map div b{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:0 auto 4px;border:1px solid var(--mut);border-radius:50%;font-size:14px;font-weight:400}
.map .on{color:var(--ink)}.map .on b{background:var(--acc);border-color:var(--acc);color:var(--on)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:16px}
h2{font-size:19px;font-weight:600;letter-spacing:.04em;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
h3{font-weight:600;margin:14px 0 4px}
.hint{color:var(--mut);font-size:14px;margin:0 0 14px}
select,input{font:inherit;padding:1px 4px;border:0;border-bottom:1.5px solid var(--acc);border-radius:0;background:transparent;color:var(--ink);text-align:center;outline:none}
select.ok,input.ok{border-bottom-color:var(--ok);color:var(--ok)}select.bad,input.bad{border-bottom-color:var(--bad);color:var(--bad)}
button{font:inherit;cursor:pointer;border:1px solid var(--acc);border-radius:999px;padding:8px 20px;background:var(--acc);color:var(--on);letter-spacing:.05em}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--mut)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px dotted var(--line)}.row span{flex:1;min-width:150px}
.pick.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px}
.opt.sel{background:var(--acc);color:var(--on);border-color:var(--acc)}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.msg{min-height:24px;margin-top:12px}
.big{text-align:center;margin:4px 0 12px}
.hanko{display:inline-block;background:var(--bad);color:#fff;font-size:44px;line-height:1.2;padding:6px 14px;border-radius:6px}
.ord{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;color:var(--ink);border:1px dashed var(--mut);border-radius:8px}
</style></head><body><div class="w">
<h1>Parable Treasure Hunt</h1>
<p class="sub">Intro Lesson 3 · find the secrets of the Kingdom of Heaven</p>
<div class="map" id="map"><div><b>1</b>Verse</div><div><b>2</b>Sort</div><div><b>3</b>Map</div><div><b>4</b>Quiz</div><div><b>5</b>Secret</div></div>
<div id="stage"></div>
<p class="sub" id="score"></p>
</div>
<script>
var lvl=0,gems=0,stage=document.getElementById('stage');
function sel(opts,ans){var s='<select data-a="'+ans+'"><option value="">?</option>';opts.forEach(function(o){s+='<option>'+o+'</option>'});return s+'</select>'}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function setMap(){[].forEach.call(document.querySelectorAll('#map div'),function(d,i){d.className=i<=lvl?'on':''});document.getElementById('score').textContent='💎 Gems: '+gems}
function done(ok,total,btn,next){gems+=ok;setMap();var m=document.getElementById('msg');
 if(ok===total){m.textContent='🎉 Perfect! +'+ok+' gems. Chest unlocked!';btn.textContent='Next chest →';btn.onclick=function(){lvl++;render()}}
 else{m.textContent='Not quite — '+ok+' of '+total+' right. Fix the red ones and try again!'}}
function checkSelects(btn,total){var ok=0,ss=stage.querySelectorAll('select,input[data-a]');ss.forEach(function(s){var nm=function(v){return v.toLowerCase().replace(/[^a-z0-9]/g,'')};var g=s.dataset.a.split('|').some(function(x){return nm(x)===nm(s.value)});s.className=g?'ok':'bad';if(g)ok++});
 gems-=btn._last||0;btn._last=ok;done(ok,total,btn)}
var L=[
function(){var I=function(a,w){return '<input data-a="'+a+'" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:'+w+'ch">'};
 return '<h2>Level 1: Dive for the Key Verse</h2><p class="hint">Type the missing words. No word bank this time. Tap Hint if you get stuck!</p><p><b>Main Reference:</b> '+I('Mt 13:34|Matthew 13:34|Mt. 13:34',10)+'</p><p>“Jesus '+I('spoke',8)+' all these '+I('things',8)+' to the '+I('crowd',8)+' in '+I('parables',10)+'; he did not '+I('say',5)+' anything to them '+I('without',9)+' using a '+I('parable',10)+'.”</p><button id="chk">Check</button> <button class="alt" id="hint">Hint</button><div class="msg" id="msg"></div>'},
function(){return '<h2>Level 2: Who’s Who?</h2><p class="hint">Mt 13:10–15 &amp; Mk 4:10–12. Is it <b>You</b> (the ones who come out to Jesus) or <b>They</b> (the outsiders)?</p><div id="cards"></div><button id="chk">Check</button><div class="msg" id="msg"></div>'},
function(){return '<h2>Level 3: Treasure Map</h2><p class="hint">The secret travels from deep underwater to the surface. Tap the cards in the right order: first → last.</p><div id="cards"></div><button class="alt" id="rst">Reset</button><div class="msg" id="msg"></div>'},
function(){return '<h2>Level 4: Pop Quiz</h2><div id="qz"></div><button id="chk">Check</button><div class="msg" id="msg"></div>'},
function(){var K=['Kingdom','Kindness'],H=['Heaven','Harvest'],P=['parables','prophets'],Pl=['plainly','privately'];
 return '<h2>Final Chest: The Secret</h2><p class="hint">Complete the conclusion to open the Kingdom of Heaven chest.</p><p>All the answers of the secrets of the '+sel(K,'Kingdom')+' of '+sel(H,'Heaven')+' hidden in '+sel(P,'parables')+' are explained in the Bible, and Jesus promised to tell us '+sel(Pl,'plainly')+' when the time comes (Jn 16:25).</p><button id="chk">Open the chest</button><div class="msg" id="msg"></div>'}
];
var sortData=[['Comes out to Jesus','You'],['Understands','You'],['Eyes &amp; ears: open','You'],['Gets the revealed word','You'],['Forgiven','You'],['Enters Heaven','You'],['Stays outside','They'],['Does not understand','They'],['Eyes &amp; ears: closed','They'],['Hears only parables','They'],['Not forgiven','They'],['Misses Heaven','They']];
var mapData=[['Hidden','Ps 78:2'],['Parable','Mt 13:34–35'],['Revealed','Jn 16:25']];
var quiz=[
{q:'Why did Jesus speak about the Kingdom of Heaven in parables? (pick 2)',m:1,o:['To fulfill what the prophet said (Ps 78:2)','To reveal secrets to His followers and keep them from outsiders (Mt 13:10–15)','To make the crowd laugh','To save time'],a:[0,1]},
{q:'What is the result of NOT understanding the true meaning of parables?',o:['Nothing changes','They are not forgiven','They get extra homework','They become prophets'],a:[1]},
{q:'When do we get to understand the true meaning of the parables?',o:['Never','When Jesus tells us plainly, when the time comes (Jn 16:25)','Only in the Old Testament','When we guess right'],a:[1]}];
function spinCard(){var T=[['🐑','Animal','a parable that uses an animal (like the lost sheep)'],['💎','Object','a parable that uses an inanimate object','<h3>Hungry and Thirsty Believers</h3><ul><li>Read Mt 13 and Mt 24.</li><li>Write down all the parables mentioned, and the things you don’t understand.</li></ul>'],['🧑','Person','a parable that uses a person (like the sower or the prodigal son)'],['📜','History','a parable that uses a historical account (like Jonah)'],['⛰️','Place','a parable that uses a geographical location','<ol><li>Explain the example used in the lesson and include a verse.</li></ol>']],col=['#6f8f5e','#b5483a','#5b7a93','#b8832f','#8a6a4f'],rot=0,busy=false,done2=false,c=document.createElement('div');c.className='card';
 var s='<h2>Bonus Round: Spin &amp; Testify!</h2><p class="hint">Spin the wheel to land on a type of parable, then testify about it to the group.</p><svg viewBox="0 0 300 300" width="100%" style="max-width:300px;display:block;margin:0 auto"><g id="wh" style="transform-origin:150px 150px;transition:transform 4s cubic-bezier(.15,.7,.1,1)">';
 for(var i=0;i<5;i++){var a0=(-90+i*72)*Math.PI/180,a1=(-90+(i+1)*72)*Math.PI/180,m=(-90+i*72+36),ma=m*Math.PI/180,lx=150+88*Math.cos(ma),ly=150+88*Math.sin(ma);
  s+='<path d="M150 150L'+(150+135*Math.cos(a0))+' '+(150+135*Math.sin(a0))+'A135 135 0 0 1 '+(150+135*Math.cos(a1))+' '+(150+135*Math.sin(a1))+'Z" fill="'+col[i]+'" stroke="#f4ede1" stroke-width="2"/>';
  s+='<g transform="rotate('+(m+90)+' '+lx+' '+ly+')"><text x="'+lx+'" y="'+(ly-2)+'" text-anchor="middle" font-size="26">'+T[i][0]+'</text><text x="'+lx+'" y="'+(ly+18)+'" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">'+T[i][1]+'</text></g>'}
 s+='</g><circle cx="150" cy="150" r="14" fill="#f4ede1"/><polygon points="138,4 162,4 150,30" fill="#222" stroke="#f4ede1" stroke-width="2"/></svg><div style="text-align:center;margin-top:10px"><button id="spin">SPIN!</button></div><div id="sres"></div>';
 c.innerHTML=s;var sb=c.querySelector('#spin'),wh=c.querySelector('#wh'),res=c.querySelector('#sres');
 sb.onclick=function(){if(busy)return;busy=true;res.innerHTML='';sb.disabled=true;rot+=1440+Math.floor(Math.random()*360);wh.style.transform='rotate('+rot+'deg)';
  setTimeout(function(){var i=Math.floor(((360-rot%360)%360)/72),t=T[i];busy=false;sb.disabled=false;sb.textContent='Spin again';done2=false;
   res.innerHTML='<h3>'+t[0]+' '+t[1]+'!</h3><p>Testify about <b>'+t[2]+'</b>.</p>'+(t[3]||'<ol><li>Pick a parable of this type and explain its <b>true meaning</b>.</li><li>Share how that truth shows up in your life, or what the Lord has revealed to you.</li><li>Finish with one thing you will do this week.</li></ol>')+'<button id="tdone">I testified! ✓</button>';
   res.querySelector('#tdone').onclick=function(){if(done2)return;done2=true;gems+=2;setMap();this.textContent='🎉 +2 gems! Amen!'}},4100)};
 return c}
function render(){setMap();stage.innerHTML='';var c=document.createElement('div');c.className='card';
 if(lvl>=L.length){c.innerHTML='<div class="big"><span class="hanko">✓</span></div><h2 style="text-align:center">Treasure unlocked!</h2><p style="text-align:center">You found the secrets of the Kingdom of Heaven. Total: 💎 '+gems+'</p><p style="text-align:center"><b>Therefore, let’s do our best to perceive the true meaning of the parables, since God has chosen us to teach His secrets.</b></p><p style="text-align:center;color:#b5483a"><b>🏠 Homework: Memorize Mt 13:10–11</b></p><div style="text-align:center"><button onclick="lvl=0;gems=0;render()">Play again</button></div>';stage.appendChild(c);stage.appendChild(spinCard());return}
 c.innerHTML=L[lvl]();stage.appendChild(c);var b=document.getElementById('chk');
 if(lvl===0){b.onclick=function(){checkSelects(b,stage.querySelectorAll('input[data-a]').length)};document.getElementById('hint').onclick=function(){document.getElementById('msg').textContent='Word bank: spoke · things · crowd · parables · say · without · parable · Mt 13:34'}}
 if(lvl===4)b.onclick=function(){checkSelects(b,4)};
 if(lvl===1){var box=document.getElementById('cards'),ans={};shuffle(sortData).forEach(function(d,i){var r=document.createElement('div');r.className='row';
  r.innerHTML='<span>'+d[0]+'</span><button class="alt pick" data-v="You">You</button><button class="alt pick" data-v="They">They</button>';
  [].forEach.call(r.querySelectorAll('button'),function(x){x.onclick=function(){ans[i]=x.dataset.v;[].forEach.call(r.querySelectorAll('button'),function(y){y.classList.toggle('sel',y===x)})}});
  r._d=d;r._i=i;box.appendChild(r)});
  var last=0;b.onclick=function(){var ok=0;[].forEach.call(box.children,function(r){var g=ans[r._i]===r._d[1];if(g)ok++;r.style.outline=g?'2px solid var(--ok)':(ans[r._i]?'2px solid var(--bad)':'none');r.style.borderRadius='10px'});gems-=last;last=ok;done(ok,12,b)}}
 if(lvl===2){var box2=document.getElementById('cards'),n=0,m=document.getElementById('msg');
  function build(){box2.innerHTML='';n=0;m.textContent='';shuffle(mapData).forEach(function(d,i){var x=document.createElement('button');x.className='ord';x.innerHTML='<b>'+d[0]+'</b> — '+d[1];
   x.onclick=function(){if(x.disabled)return;if(d[0]===mapData[n][0]){x.disabled=true;x.style.borderStyle='solid';x.style.borderColor='var(--ok)';x.innerHTML='✅ '+(n+1)+'. '+x.innerHTML;n++;
    if(n===3){gems+=3;setMap();m.textContent='🎉 Perfect! +3 gems. The treasure rose from the deep to the surface!';var nb=document.createElement('button');nb.textContent='Next chest →';nb.onclick=function(){lvl++;render()};m.appendChild(document.createElement('br'));m.appendChild(nb)}}
    else{m.textContent='Hmm, that one comes a bit later. Try again!'}};box2.appendChild(x)})}
  build();document.getElementById('rst').onclick=build}
 if(lvl===3){var qz=document.getElementById('qz'),pick=quiz.map(function(){return[]});
  quiz.forEach(function(q,qi){var d=document.createElement('div');d.innerHTML=(q.h?'<h3>'+q.h+'</h3>':'')+'<p><b>'+(qi+1)+'. '+q.q+'</b></p>';q.o.forEach(function(o,oi){var x=document.createElement('button');x.className='opt';x.textContent=o;
   x.onclick=function(){var p=pick[qi],k=p.indexOf(oi);if(q.m){if(k>-1)p.splice(k,1);else p.push(oi)}else{pick[qi]=[oi]}
    [].forEach.call(d.querySelectorAll('.opt'),function(y,yi){y.className='opt'+(pick[qi].indexOf(yi)>-1?' sel':'')})};d.appendChild(x)});qz.appendChild(d)});
  var lastq=0;b.onclick=function(){var ok=0;quiz.forEach(function(q,qi){var g=pick[qi].slice().sort().join()===q.a.join();if(g)ok++;
   [].forEach.call(qz.children[qi].querySelectorAll('.opt'),function(y,yi){var s=pick[qi].indexOf(yi)>-1;y.className='opt'+(s?(g?' ok':' bad'):'')})});gems-=lastq;lastq=ok;done(ok,quiz.length,b)}}
}
render();
</script></body></html>
